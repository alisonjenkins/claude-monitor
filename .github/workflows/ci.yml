name: CI

# Build, lint, format-check, test and dependency-review on every push to main
# and every PR.
#
# `Test` always runs (short-circuiting when no build inputs changed) so it can
# be a required status check: a job skipped by a top-level `if:` never reports,
# which would block merges of docs-only PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'nix/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no buildable changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust/build inputs changed — Test is a no-op success."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.rust == 'true'

      - uses: ./.github/actions/setup-nix
        if: needs.changes.outputs.rust == 'true'

      # Builds the package and runs cargo test, clippy -D warnings, fmt --check
      # and the home-manager module eval check.
      - name: Flake check
        if: needs.changes.outputs.rust == 'true'
        run: nix flake check --print-build-logs

      - name: cargo deny
        if: needs.changes.outputs.rust == 'true'
        run: nix develop --command cargo deny check

  build-macos:
    name: Build (macOS)
    needs: changes
    runs-on: macos-latest
    steps:
      - name: Skip (no buildable changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust/build inputs changed — macOS build is a no-op success."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.rust == 'true'

      - uses: ./.github/actions/setup-nix
        if: needs.changes.outputs.rust == 'true'

      - name: Build
        if: needs.changes.outputs.rust == 'true'
        run: nix build --print-build-logs

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
