[package]
name = "claude-monitor"
version = "0.2.0"
edition = "2021"
description = "TUI dashboard for monitoring multiple Claude Code sessions in tmux"
license = "MIT OR Apache-2.0"

[features]
default = ["tui", "web"]
tui = ["dep:ratatui", "dep:crossterm"]
web = [
    "dep:axum", "dep:tokio", "dep:futures-util", "dep:getrandom", "dep:maud", "dep:form_urlencoded",
    "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:hyper", "dep:hyper-util",
    "dep:p12-keystore", "dep:zeroize", "dep:x509-parser", "dep:time",
]

[lib]
name = "claude_monitor"
path = "src/lib.rs"

[[bin]]
name = "claude-monitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "original-uri"], optional = true }
form_urlencoded = { version = "1", optional = true }
maud = { version = "0.27", optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "signal", "macros", "io-util"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
getrandom = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
p12-keystore = { version = "0.4.1", optional = true }
zeroize = { version = "1.9.1", optional = true }
x509-parser = { version = "0.18.1", optional = true }
time = { version = "0.3.55", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
rustix = { version = "1", features = ["event", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"

[[test]]
name = "wal_notify"
path = "tests/spikes/wal_notify.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
