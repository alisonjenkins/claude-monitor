[package]
name = "claude-monitor"
version = "0.2.0"
edition = "2021"
description = "TUI dashboard for monitoring multiple Claude Code sessions in tmux"
license = "MIT OR Apache-2.0"

[features]
default = ["tui", "web"]
tui = ["dep:ratatui", "dep:crossterm"]
web = []

[lib]
name = "claude_monitor"
path = "src/lib.rs"

[[bin]]
name = "claude-monitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "wal_notify"
path = "tests/spikes/wal_notify.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
